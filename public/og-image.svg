<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#1f5bff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#4f7dff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f7dff"/>
      <stop offset="100%" stop-color="#1f5bff"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Brand mark + wordmark -->
  <g transform="translate(80, 100)">
    <rect width="64" height="64" rx="16" fill="url(#logo)"/>
    <text x="32" y="48" text-anchor="middle" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-2">S</text>
    <text x="84" y="46" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#0a0e1a" letter-spacing="-1.2">Saldox</text>
  </g>

  <!-- Eyebrow pill -->
  <g transform="translate(80, 220)">
    <rect width="320" height="38" rx="19" fill="#ffffff" stroke="#d9e4ff" stroke-width="1"/>
    <circle cx="22" cy="19" r="4" fill="#1f5bff"/>
    <text x="36" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#1a2236">
      Nowość · 47 świeżych promocji
    </text>
  </g>

  <!-- Headline -->
  <text x="80" y="340" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="88" font-weight="600" fill="#0a0e1a" letter-spacing="-4">
    Bonus bankowy?
  </text>
  <text x="80" y="430" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="88" font-weight="600" fill="#5a6478" letter-spacing="-4">
    Już go mamy.
  </text>

  <!-- Sub -->
  <text x="80" y="500" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#5a6478">
    Codziennie sprawdzamy 24 banki. Bez gwiazdek, bez BIK-u.
  </text>

  <!-- URL -->
  <text x="80" y="580" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#1f5bff">
    saldox.pl
  </text>
</svg>
