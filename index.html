    <!-- Fonts self-hosted via @fontsource (Geist + Geist Mono + JetBrains Mono).

    <!-- Structured data: ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://vernex.pl/#organization",
        "name": "Vernex",
        "alternateName": "Vernex Engineering Studio",
        "description": "Premium frontend engineering studio. WebGL, AI agents, architektury B2B.",
        "url": "https://vernex.pl/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://vernex.pl/favicon.svg",
          "caption": "Vernex"
        },
        "image": "https://vernex.pl/api/og",
        "email": "biuro@vernex.pl",
        "areaServed": [
          { "@type": "Country", "name": "Poland" },
          { "@type": "Country", "name": "Germany" }
        ],
        "serviceType": [
          "Frontend Engineering",
          "AI Agent Development",
          "WebGL Development",
          "B2B System Architecture",
          "Claude API Integration",
          "Supabase Integration"
        ],
        "knowsAbout": [
          "React",
          "WebGL",
          "Three.js",
          "Vercel AI SDK",
          "Anthropic Claude",
          "Supabase",
          "TypeScript",
          "Edge Functions"
        ],
        "slogan": "Twój stos. Jeden warsztat.",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Vernex Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "AI Agents B2B",
                "description": "Autonomiczne agenty z Vercel AI SDK + Anthropic Claude. Tool use, RAG, multi-agent orchestration."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "WebGL Development",
                "description": "Premium frontendy z GPU acceleration. three.js + @react-three/fiber, 60fps na 75 000 cząsteczek."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "CRM / Panele B2B",
                "description": "Dedykowane CRM-y i panele administracyjne dla wymagających branż. Supabase + React 19."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Integracje + Migracje danych",
                "description": "Claude API, Stripe, KSeF, Baselinker, MetaTrader 5, WhatsApp Business — dedykowane integracje."
              }
            }
          ]
        }
      }
    </script>
